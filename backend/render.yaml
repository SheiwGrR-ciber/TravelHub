services:
  - type: web
    name: travelhub-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRAVELHUB_DATABASE_URL
        fromDatabase:
          name: travelhub-db
          property: connectionString
      - key: TRAVELHUB_SECRET_KEY
        generateValue: true
      - key: TRAVELHUB_TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: travelhub-db
    plan: free
    region: oregon
